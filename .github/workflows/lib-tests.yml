# Copyright IBM 2025
name: lib-tests

on:
  push:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - 'app/**'
      - '.github/workflows/lib-tests.yml'
  pull_request:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - 'app/**'
      - '.github/workflows/lib-tests.yml'
  workflow_dispatch:  # Allow manual triggering
  workflow_call:      # Allow other workflows to call this one

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.13
       
    - name: Copy gradle.properties from template
      run: cp gradle.properties.template gradle.properties
        
    - name: Generate Gradle wrapper scripts
      run: gradle wrapper
        
    - name: Run lib tests
      run: ./gradlew :lib:jar :lib:test

    - name: Assemble anroid app test
      run: ./gradlew :app:assembleDebug