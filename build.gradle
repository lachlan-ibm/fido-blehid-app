apply plugin: 'java'
apply plugin: 'maven-publish'

// Apply the copyright hook
apply from: 'copyright-hook.gradle'

version = "0.00.10"

repositories {
    mavenCentral()  
    mavenLocal()    
    flatDir {       
        dirs "dist"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// We're using the lib directory as a separate module now, so we don't need to include it as a source directory

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.18.1'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation 'com.macasaet.fernet:fernet-java8:1.4.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
}

jar {
    manifest{
        attributes ("Lib-Version" : "0.00.01")
    }
    archiveBaseName = 'com.isfs.blekey.common'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'isfs'
            artifactId = 'com.isfs.blekey.common'
            version = '0.00.10'

            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

// Run copyright check before build
tasks.withType(JavaCompile) {
    dependsOn checkCopyrightHeaders
}

