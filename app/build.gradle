buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        mavenLocal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.isfs.blekey' 

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    defaultConfig {
        applicationId "com.isfs.blekey"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources.excludes.add("META-INF/versions/9/OSGI-INF/MANIFEST.MF")
        resources.excludes.add("META-INF/NOTICE.md")
        resources.excludes.add("META-INF/LICENSE.md")
    }
}



configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    mavenLocal()
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.0.2'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'no.nordicsemi.android:ble:2.6.1'
    
    // Use the lib module directly instead of the published artifact
    implementation project(':lib')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// JavaDoc configuration for Android app
tasks.register('androidJavadoc', Javadoc) {
    description = 'Generates Javadoc API documentation for the Android app code.'
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    classpath += configurations.implementation
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.links = ['https://docs.oracle.com/en/java/javase/17/docs/api/']
    title = "FIDO BLE HID Android App API Documentation"
    
    // Exclude generated files
    exclude '**/BuildConfig.java'
    exclude '**/R.java'
    
    // Handle Android-specific annotations
    options.tags = [ "hide", "attr" ]
    
    // Avoid errors on missing documentation
    failOnError false
}

// Create a task to generate all JavaDocs
tasks.register('generateAllJavadocs') {
    dependsOn 'androidJavadoc'
    dependsOn ':lib:libJavadoc'
    description = 'Generates all JavaDoc documentation for both app and library code'
}

task wrapper(type: Wrapper){
   gradleVersion = '8.1.1'
}

