apply plugin: 'java'
// NOTE: Eclipse plugin disabled - .classpath is managed manually via app/regenrate_classpath.sh
// The Gradle Buildship plugin automatically regenerates .classpath files, overwriting manual
// configurations needed for Android projects in VS Code (JRE container, Android SDK, AAR deps)
// apply plugin: 'eclipse'


repositories {
    mavenCentral()  
    mavenLocal()    
    flatDir {       
        dirs "dist"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

wrapper {
    gradleVersion = '8.13'
    distributionType = Wrapper.DistributionType.BIN
}

