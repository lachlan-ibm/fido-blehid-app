# Copyright IBM 2025
name: Lib Unit Tests

on:
  push:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - '.github/workflows/lib-tests.yml'
  pull_request:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - '.github/workflows/lib-tests.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.13
       
    - name: Copy gradle.properties from template
      run: cp gradle.properties.template gradle.properties
        
    - name: Generate Gradle wrapper scripts
      run: gradle wrapper
        
    - name: Run tests
      run: ./gradlew :lib:test