# Copyright IBM 2025
name: Release Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lib-test:
    uses: ./.github/workflows/lib-tests.yml

  build-release-apk:
    runs-on: ubuntu-latest
    needs: lib-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Copy gradle.properties from template
        run: cp gradle.properties.template gradle.properties

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > release-keystore.jks

      - name: Build release bundle
        env:
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:  ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" #\
            #-Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build release apk
        env:
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" #\

      - name: Rename artifacts with version tag
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/fido-blehid-0.3.${{ github.run_number }}.aab
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/fido-blehid-0.3.${{ github.run_number }}.apk

      - name: Create GitHub release
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.1.${{ github.run_number }}"
          name: "Release 0.1.${{ github.run_number }}"
          files: |
            app/build/outputs/bundle/release/fido-blehid-0.1.${{ github.run_number }}.aab
            app/build/outputs/apk/release/fido-blehid-0.1.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
