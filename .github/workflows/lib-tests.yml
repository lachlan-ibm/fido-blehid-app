# Copyright IBM 2025
name: Lib Unit Tests

on:
  push:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - '.github/workflows/lib-tests.yml'
  pull_request:
    branches: [ development, stable ]
    paths:
      - 'lib/**'
      - '.github/workflows/lib-tests.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.13
       
    - name: Generate Gradle wrapper scripts
      run: gradle wrapper
        
    - name: Run tests
      run: ./gradlew :lib:test --info
      
    - name: Upload test results
      if: always()  # Run even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: lib-test-results
        path: |
          lib/build/reports/tests/test/
          lib/build/test-results/test/
        retention-days: 7
        
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v3
      if: always()  # Run even if tests fail
      with:
        report_paths: 'lib/build/test-results/test/TEST-*.xml'
        fail_on_failure: true
        require_tests: true
        check_name: 'Lib Test Results'

