android {
    namespace = 'com.isfs.blekey'

    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.isfs.blekey"
        minSdkVersion 33
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources.excludes.add("META-INF/versions/9/OSGI-INF/MANIFEST.MF")
        resources.excludes.add("META-INF/NOTICE.md")
        resources.excludes.add("META-INF/LICENSE.md")
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
            }
        }
    }

}



configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    mavenLocal()
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'androidx.core:core:1.13.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'no.nordicsemi.android:ble:2.10.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // ZXing for QR code scanning (Phase 1: QR Scanner Integration)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    
    // Android Credential Manager (Phase 4.2)
    // Note: Full Credential Manager API requires Android 14+ (API 34+)
    // These dependencies provide the foundation for future integration
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    
    // Use the lib module directly instead of the published artifact
    implementation project(':lib')
}

// JavaDoc configuration for Android app
tasks.register('androidJavadoc', Javadoc) {
    description = 'Generates Javadoc API documentation for the Android app code.'
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    classpath += configurations.implementation
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.links = ['https://docs.oracle.com/en/java/javase/17/docs/api/']
    title = "FIDO BLE HID Android App API Documentation"
    
    // Exclude generated files
    exclude '**/BuildConfig.java'
    exclude '**/R.java'
    
    // Handle Android-specific annotations
    options.tags = [ "hide", "attr" ]
    
    // Avoid errors on missing documentation
    failOnError false
}


// Create a task to generate all JavaDocs
tasks.register('generateAllJavadocs') {
    dependsOn 'androidJavadoc'
    dependsOn ':lib:libJavadoc'
    description = 'Generates all JavaDoc documentation for both app and library code'
}

// ============================================================================
// E2E Testing Tasks
// ============================================================================

// Task to run deep link tests
tasks.register('testDeepLinks', Exec) {
    group = 'verification'
    description = 'Runs deep link handling tests (Phase 4.1)'
    
    workingDir = projectDir
    commandLine 'bash', 'test-deep-links.sh'
    
    // Don't fail the build if tests fail, just report
    ignoreExitValue = true
    
    doFirst {
        println "Running deep link tests..."
    }
    
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.warn("Deep link tests completed with warnings. Check logs for details.")
        } else {
            println "✓ Deep link tests passed"
        }
    }
}

// Task to run credential manager tests
tasks.register('testCredentialManager', Exec) {
    group = 'verification'
    description = 'Runs Credential Manager integration tests (Phase 4.2)'
    
    workingDir = projectDir
    commandLine 'bash', 'test-credential-manager.sh', project.findProperty('deviceId') ?: 'emulator-5554'
    
    ignoreExitValue = true
    
    doFirst {
        println "Running Credential Manager tests..."
    }
    
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.warn("Credential Manager tests completed with warnings. Check logs for details.")
        } else {
            println "✓ Credential Manager tests passed"
        }
    }
}

// Task to run E2E credential issuance tests
tasks.register('testE2EIssuance', Exec) {
    group = 'verification'
    description = 'Runs end-to-end credential issuance tests'
    
    workingDir = projectDir
    commandLine 'bash', 'test-e2e-credential-issuance.sh', project.findProperty('deviceId') ?: 'emulator-5554'
    
    ignoreExitValue = true
    
    doFirst {
        println "Running E2E credential issuance tests..."
    }
    
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.warn("E2E issuance tests completed with warnings. Check logs for details.")
        } else {
            println "✓ E2E issuance tests passed"
        }
    }
}

// Task to run complete E2E flow tests
tasks.register('testE2ECompleteFlow', Exec) {
    group = 'verification'
    description = 'Runs complete end-to-end digital credentials flow tests'
    
    workingDir = projectDir
    commandLine 'bash', 'test-e2e-complete-flow.sh', project.findProperty('deviceId') ?: 'emulator-5554'
    
    ignoreExitValue = true
    
    doFirst {
        println "═══════════════════════════════════════════════════════════"
        println "Running Complete E2E Digital Credentials Flow Tests"
        println "═══════════════════════════════════════════════════════════"
    }
    
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.warn("E2E complete flow tests completed with warnings. Check build/ux-test-results/e2e-complete-flow/ for details.")
        } else {
            println "✓ Complete E2E flow tests passed"
            println ""
            println "Results: build/ux-test-results/e2e-complete-flow/"
            println "Report:  build/ux-test-results/e2e-complete-flow/E2E_COMPLETE_FLOW_REPORT.md"
        }
    }
}

// Task to run all Phase 4 tests
tasks.register('testUXAll', Exec) {
    group = 'verification'
    description = 'Runs all Phase UX tests'
    
    workingDir = projectDir
    commandLine 'bash', '-c', '''
        echo "Running all UX Verification tests..."
        ./test-deep-links.sh
        ./test-credential-manager.sh ${1:-emulator-5554}
        ./test-e2e-credential-issuance.sh ${1:-emulator-5554}
    ''', 'bash', project.findProperty('deviceId') ?: 'emulator-5554'
    
    ignoreExitValue = true
    
    doFirst {
        println "═══════════════════════════════════════════════════════════"
        println "Running All UX Verification Tests"
        println "═══════════════════════════════════════════════════════════"
    }
    
    doLast {
        println ""
        println "UX Verification test suite completed. Check build/ux-test-results/ for details."
    }
}

// Convenience task to install and test
tasks.register('installAndTestE2E') {
    group = 'verification'
    description = 'Installs the app and runs complete E2E tests'
    
    dependsOn 'installDebug'
    finalizedBy 'testE2ECompleteFlow'
    
    doFirst {
        println "Installing app and running E2E tests..."
    }
}

// Convenience task to install and test all Phase 4
tasks.register('installAndTestPhase4') {
    group = 'verification'
    description = 'Installs the app and runs all Phase 4 tests'
    
    dependsOn 'installDebug'
    finalizedBy 'testPhase4All'
    
    doFirst {
        println "Installing app and running all Phase 4 tests..."
    }
}

