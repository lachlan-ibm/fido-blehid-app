# Copyright IBM 2025
name: Release Build

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lib-test:
    uses: ./.github/workflows/lib-tests.yml
  copyright-check:
    uses: ./.github/workflows/copyright-check.yml

  build-release-apk:
    runs-on: ubuntu-latest
    needs: lib-test
    environment: actions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Copy gradle.properties from template
        run: cp gradle.properties.template gradle.properties

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_B64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" | grep "Certificate fingerprint"

      - name: Build release artifacts
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :app:bundleRelease
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed 's/[^0-9]//g')
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/fido-blehid-0.${VERSION_CODE}.${{ github.run_number }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fido-blehid-apk
          path: app/build/outputs/apk/release/fido-blehid-*.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.keystore

  upload-to-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build-release-apk
    environment: actions
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fido-blehid-apk
          path: dist/

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fido-blehid-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}