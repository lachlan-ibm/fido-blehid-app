 */
apply plugin: 'java-library'

// Apply the copyright hook
apply from: '../copyright-hook.gradle'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Configure source sets to separate main and test code
sourceSets {
    main {
        java {
            srcDirs = ['com']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test/resources']
        }
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.18.1'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation 'com.macasaet.fernet:fernet-java8:1.4.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-inline:5.11.0' // For mocking static methods
}

// Configure test task to use JUnit Platform
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// JavaDoc configuration
tasks.register('libJavadoc', Javadoc) {
    description = 'Generates Javadoc API documentation for the lib code.'
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.links = ['https://docs.oracle.com/en/java/javase/17/docs/api/']
    title = "FIDO BLE HID Library API Documentation"
}

// Run copyright check before build
tasks.withType(JavaCompile) {
    dependsOn checkCopyrightHeaders
}

