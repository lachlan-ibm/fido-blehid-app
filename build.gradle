apply plugin: 'java'

// Buildship's init.d/eclipsePlugin.gradle (injected by the Java Language Server) runs
// `allprojects { apply plugin: "eclipse" }` at every IDE sync. On the :app Android
// subproject this causes the eclipseClasspath task to overwrite our hand-crafted
// .classpath with stale build/aarLibraries/... paths that don't exist on disk.
//
// Counter-measure: redirect the eclipseClasspath output file for :app to /dev/null so
// the task runs harmlessly and never touches our managed .classpath. Scoped to :app
// only (not :lib, which manages its own eclipse config). Done here in the root
// build.gradle so it is registered before AGP evaluates the android {} block in
// app/build.gradle, avoiding the spurious "does not specify compileSdk" error that
// fires when eclipse {} DSL is configured from within app/build.gradle itself.
project(':app') {
    plugins.withId('eclipse') {
        tasks.matching { it.name == 'eclipseClasspath' }.configureEach { enabled = false }
    }
}


repositories {
    mavenCentral()  
    mavenLocal()    
    flatDir {       
        dirs "dist"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

wrapper {
    gradleVersion = '8.13'
    distributionType = Wrapper.DistributionType.BIN
}

